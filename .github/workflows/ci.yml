name: build and deploy Chinese book to gh-pages

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup elan
        run: |
          curl -O --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh
          chmod u+x elan-init.sh
          ./elan-init.sh -y --default-toolchain none

      - name: Set elan paths
        run: |
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install Lean toolchain for examples
        run: |
          cd examples
          lean --version

      - name: Install Lean toolchain for Chinese book
        run: |
          cd book_zh
          lean --version

      - name: Cache Lake build directories
        uses: actions/cache@v4
        with:
          path: |
            book_zh/.lake
            examples/.lake
          key: ${{ runner.os }}-lake-${{ hashFiles('book_zh/lake-manifest.json', 'book_zh/lean-toolchain', 'examples/lake-manifest.json', 'examples/lean-toolchain') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-lake-${{ hashFiles('book_zh/lake-manifest.json', 'book_zh/lean-toolchain', 'examples/lake-manifest.json', 'examples/lean-toolchain') }}-

      - name: Build examples helper tools
        run: |
          cd examples
          lake build subverso-extract-mod subverso-helper --no-ansi

      - name: Build Chinese book
        run: |
          cd book_zh
          lake exe tpil --no-ansi

      - name: Deploy Chinese book to gh-pages
        if: github.event_name == 'push' && github.ref_name == 'master'
        run: |
          touch book_zh/_out/html-multi/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add -B gh-pages gh-pages-worktree origin/gh-pages
          find gh-pages-worktree -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a book_zh/_out/html-multi/. gh-pages-worktree/
          cd gh-pages-worktree
          git add -A
          git commit -m "Deploy Chinese book to GitHub Pages" || exit 0
          git push origin gh-pages
