name: build and deploy Chinese book

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup elan
        run: |
          curl -O --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh
          chmod u+x elan-init.sh
          ./elan-init.sh -y --default-toolchain none

      - name: Set elan paths
        run: |
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install Lean toolchain for examples
        run: |
          cd examples
          lean --version

      - name: Install Lean toolchain for Chinese book
        run: |
          cd book_zh
          lean --version

      - name: Cache Lake build directories
        uses: actions/cache@v4
        with:
          path: |
            book_zh/.lake
            examples/.lake
          key: ${{ runner.os }}-lake-${{ hashFiles('book_zh/lake-manifest.json', 'book_zh/lean-toolchain', 'examples/lake-manifest.json', 'examples/lean-toolchain') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-lake-${{ hashFiles('book_zh/lake-manifest.json', 'book_zh/lean-toolchain', 'examples/lake-manifest.json', 'examples/lean-toolchain') }}-

      - name: Build Chinese book
        run: |
          cd book_zh
          lake exe tpil --no-ansi

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref_name == 'master'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref_name == 'master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: book_zh/_out/html-multi

  deploy:
    if: github.event_name == 'push' && github.ref_name == 'master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
