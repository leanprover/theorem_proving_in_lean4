name: Deploy

# Publishes the HTML that CI built. This workflow runs in the base repository,
# where the Netlify credentials live, and takes the build artifact as its only
# input.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  deploy:
    name: Deploy to Netlify
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # This concurrency group setting ensures that there's no races between jobs
    # for production or a given PR's preview
    concurrency:
      group: >-
        deploy-${{ (github.event.workflow_run.event == 'push' &&
        startsWith(github.event.workflow_run.head_branch, 'release-'))
        && 'production' || format('preview-{0}', github.event.workflow_run.head_sha) }}
      cancel-in-progress: false
    permissions:
      actions: read # download the artifact belonging to the CI run
      contents: read # read the commit subject for the deploy message
      pull-requests: read # read the pull request title for the deploy message
      deployments: write # record the deployment against its environment
      statuses: write # report the resulting URL on the commit that was built
    env:
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      TRIGGERING_EVENT: ${{ github.event.workflow_run.event }}
      ENVIRONMENT: lean-lang.org/theorem_proving_in_lean4
    outputs:
      production: ${{ steps.info.outputs.production }}
    steps:
      - name: Download book HTML
        uses: actions/download-artifact@v8.0.2
        with:
          name: book-html
          path: html-multi
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - id: info
        name: Compute deployment metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Netlify caps an alias at 37 characters.
          echo "alias=${HEAD_SHA:0:32}" >> "$GITHUB_OUTPUT"

          # Pushing a release- tag publishes the book. Everything else, master
          # included, goes to a preview alias. A tag push arrives here with the
          # tag name in head_branch.
          case "$TRIGGERING_EVENT:$HEAD_BRANCH" in
            push:release-*) echo "production=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "production=false" >> "$GITHUB_OUTPUT" ;;
          esac

          # The pull request number comes from the commit that was built. The
          # message goes to a file because it carries a pull request title or a
          # commit subject.
          message=""
          if [ "$TRIGGERING_EVENT" = pull_request ]; then
            message=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" \
              --jq 'first(.[] | select(.state == "open")) | "pr#\(.number): \(.title)"')
          fi
          if [ -z "$message" ]; then
            subject=$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq '.commit.message | split("\n")[0]')
            message="ref/$HEAD_BRANCH: $subject"
          fi
          printf '%s' "$message" > deploy-message.txt

      # Search engines index the published book, reached through the release-
      # tag path below, which leaves this for the preview deploys.
      - name: Keep previews out of search results
        if: steps.info.outputs.production != 'true'
        run: |
          printf '/*\n  X-Robots-Tag: noindex\n' > html-multi/_headers

      - id: netlify
        name: Deploy to Netlify hosting
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 51300c89-2f6c-4bba-a575-8cf12e434502
          ALIAS: ${{ steps.info.outputs.alias }}
          PRODUCTION: ${{ steps.info.outputs.production }}
        run: |
          set -euo pipefail

          api=https://api.netlify.com/api/v1
          call_netlify() {
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "$@"
          }

          # Polls the deploy until it reaches one of the states in $1, and
          # leaves Netlify's description of it in deploy.json.
          await_deploy() {
            local state
            for _ in $(seq 600); do
              call_netlify "$api/sites/$NETLIFY_SITE_ID/deploys/$id" > deploy.json
              state=$(jq --raw-output .state deploy.json)
              case " $1 " in *" $state "*) return ;; esac
              if [ "$state" = error ]; then
                echo "::error::Netlify deploy failed: $(jq --raw-output .error_message deploy.json)"
                exit 1
              fi
              sleep 2
            done
            echo "::error::Netlify deploy $id is still in state $state"
            exit 1
          }

          # Deploy a preview to a branch named after its alias. Netlify serves
          # it under that name and leaves the published book in place.
          if [ "$PRODUCTION" = true ]; then
            target='{"draft": false}'
          else
            target=$(jq --null-input --arg alias "$ALIAS" '{draft: false, branch: $alias}')
          fi
          id=$(call_netlify --url-query title@deploy-message.txt --json "$target" \
            "$api/sites/$NETLIFY_SITE_ID/deploys" | jq --raw-output .id)

          # Send the SHA-1 digest of every file. Netlify answers with the
          # digests of the files that it lacks.
          (cd html-multi && find . -type f -exec sha1sum {} +) |
            jq --raw-input --null-input --argjson target "$target" '
              [ inputs
                | capture("^(?<sha>[0-9a-f]{40})  \\.(?<path>/[^#?]*)$") // error("unusable file: \(.)")
                | {key: .path, value: .sha} ]
              | $target + {async: true, files: from_entries}' > manifest.json
          call_netlify --request PUT --json @manifest.json \
            "$api/sites/$NETLIFY_SITE_ID/deploys/$id" > /dev/null
          await_deploy "prepared uploading uploaded ready"

          jq --raw-output --slurpfile manifest manifest.json --arg base "$api/deploys/$id/files" '
            ($manifest[0].files | to_entries | map({key: .value, value: .key}) | from_entries) as $path
            | (.required // []) | unique[] | $path[.]
            | "upload-file = \("html-multi" + . | @json)",
              "url = \($base + (split("/") | map(@uri) | join("/")) | @json)",
              "output = \"/dev/null\""' deploy.json > uploads.txt
          echo "Netlify lacks $(grep --count '^url' uploads.txt || true) files"
          if [ -s uploads.txt ]; then
            call_netlify --config uploads.txt --parallel --parallel-max 5 --fail-early --retry 5 \
              --header "Content-Type: application/octet-stream"
          fi
          await_deploy ready

          if [ "$PRODUCTION" = true ]; then
            url=$(jq --raw-output '.ssl_url // .url' deploy.json)
          else
            url=$(jq --raw-output '.deploy_ssl_url // .deploy_url' deploy.json)
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Record the deployment
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.netlify.outputs.url }}
        run: |
          set -euo pipefail
          deployment=$(gh api "repos/$REPO/deployments" --method POST --input - --jq .id <<JSON
          {
            "ref": "$HEAD_SHA",
            "environment": "$ENVIRONMENT",
            "description": "Book",
            "auto_merge": false,
            "required_contexts": []
          }
          JSON
          )
          gh api "repos/$REPO/deployments/$deployment/statuses" \
            -f state=success \
            -f environment_url="$URL" \
            -f description="Book"

          gh api "repos/$REPO/statuses/$HEAD_SHA" \
            -f state=success \
            -f context="netlify/deploy" \
            -f target_url="$URL" \
            -f description="Book"

      - name: Report failure on the commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/statuses/$HEAD_SHA" \
            -f state=failure \
            -f context="netlify/deploy" \
            -f target_url="$RUN_URL" \
            -f description="Book"

  # The gh-pages branch serves the book's original address,
  # leanprover.github.io/theorem_proving_in_lean4, so a publication refreshes
  # it too. The job has the only token of this workflow that can write to the
  # repository, and it runs for publications alone.
  pages:
    name: Publish to GitHub Pages
    needs: deploy
    if: needs.deploy.outputs.production == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-pages
      cancel-in-progress: false
    permissions:
      actions: read # download the artifact belonging to the CI run
      contents: write # push the book to gh-pages
    env:
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Download book HTML
        uses: actions/download-artifact@v8.0.2
        with:
          name: book-html
          path: html-multi
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Push the book to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The branch gets a repository of its own, so git reads no
          # configuration or hooks from the artifact.
          rm -rf html-multi/.git
          touch html-multi/.nojekyll
          git -C html-multi init --quiet --initial-branch gh-pages
          git -C html-multi config user.name "github-actions[bot]"
          git -C html-multi config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C html-multi add --all
          git -C html-multi commit --quiet --message "Book built from $HEAD_SHA"
          git -C html-multi push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/$REPO" gh-pages
